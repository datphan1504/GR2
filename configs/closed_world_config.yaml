# ==============================================================================
# Closed-World Configuration (Thế giới đóng)
# ==============================================================================
# Giả định: Người dùng CHỈ truy cập vào tập các trang web được giám sát (monitored).
# Kẻ tấn công chỉ cần phân loại chính xác trang web trong số num_mon_sites trang.

# Directories
data_dir: "data/processed/"
raw_data_dir: "data/raw/"
artifacts_dir: "artifacts/"
predictions_dir: "artifacts/predictions/closed_world/"
checkpoint_dir: "artifacts/checkpoints/closed_world/"

# World Size Parameters
num_mon_sites: 100           # Số trang web được theo dõi (ví dụ: 100 trang)
num_mon_inst_train: 90       # 90 lượt truy cập/trang dùng để train
num_mon_inst_test: 10        # 10 lượt truy cập/trang dùng để test

# Trong Closed-World, KHÔNG CÓ trang unmonitored
num_unmon_sites_train: 0
num_unmon_sites_test: 0

# Training Hyperparameters
batch_size: 50
learning_rate: 0.001
var_cnn_max_epochs: 150
var_cnn_base_patience: 5
df_epochs: 30
validation_split: 0.05
random_seed: 42
