# ==============================================================================
# Training Configuration
# ==============================================================================

# Directories
data_dir: "data/processed/"
raw_data_dir: "data/raw/"
artifacts_dir: "artifacts/"
predictions_dir: "artifacts/predictions/"
checkpoint_dir: "artifacts/checkpoints/"

# World Size Parameters
num_mon_sites: 100
num_mon_inst_train: 90
num_mon_inst_test: 10
num_unmon_sites_train: 9000
num_unmon_sites_test: 1000

# Training Hyperparameters
batch_size: 50
learning_rate: 0.001
var_cnn_max_epochs: 150
var_cnn_base_patience: 5
df_epochs: 30

# Validation split ratio from training data
validation_split: 0.05

# Seed
random_seed: 42
